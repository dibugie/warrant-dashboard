name: 每日權證籌碼全自動更新

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製雲端檔案
      uses: actions/checkout@v3

    - name: 初始化 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 強制安裝環境必要套件
      run: |
        pip install requests pandas

    - name: 啟動核心爬蟲清洗數據
      run: python warrant_spider.py

    - name: 自動將算好的最新活數據推送到網頁外殼
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json history.csv || true
        git commit -m "自動更新盤後籌碼活數據" || true
        git push origin main || true
