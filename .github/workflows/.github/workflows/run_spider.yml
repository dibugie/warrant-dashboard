name: 每日權證籌碼全自動更新

on:
  workflow_dispatch:      # 手動觸發
  schedule:
    - cron: '30 16 * * 1-5'   # 台灣時間每天下午 16:30（交易日）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: 執行權證爬蟲
        run: python warrant_spider.py

      - name: 提交更新後的檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            git add history.csv data.json
            git commit -m "🔄 自動更新權證籌碼數據 $(date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "沒有資料變更，跳過提交。"
          fi
