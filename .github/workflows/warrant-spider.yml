name: Warrant Spider Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5'   # 台灣時間晚上 19:30

permissions:
  contents: write   # 重要！允許 push

jobs:
  update-warrant-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run warrant spider
        run: python warrant_spider.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -n "$(git status --porcelain history.csv data.json)" ]]; then
            git add history.csv data.json
            git commit -m "🔄 Auto update warrant data - $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ 推送成功"
          else:
            echo "ℹ️ 沒有變更"
